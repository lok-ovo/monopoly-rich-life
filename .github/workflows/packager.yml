# Generated by GitHub Packager. Review repository scripts before running.
name: GitHub Packager
run-name: 'Packager ${{ inputs.request_id }} · ${{ github.ref_name }}'
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Desktop request identifier (no commands)'
        required: true
        type: string
      source_sha:
        description: 'Full reviewed source commit SHA (40 hex characters)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: packager-${{ github.ref }}-${{ inputs.request_id }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-15
            arch: arm64
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
      - name: Build installation package
        env:
          PACKAGER_TARGET: ${{ matrix.target }}
          PACKAGER_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .github/packager/build.mjs
      - name: Upload installation package and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packager-artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
